<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' media: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>准星</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #wrap { position: fixed; inset: 0; }
    #img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; -webkit-user-drag: none; }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #empty {
      position: absolute; inset: 0;
      display: none; place-items: center;
      border: 1px dashed rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.7);
      font: 10px/1.4 "Microsoft YaHei UI", system-ui, sans-serif;
      text-align: center;
      background: rgba(8, 10, 16, 0.35);
      letter-spacing: 0.06em;
      pointer-events: none;
    }
    body.no-image #empty { display: grid; }
    body.adjust #wrap::after {
      content: "拖动我，放好回主界面收工";
      position: absolute; left: 50%; bottom: 4px;
      transform: translateX(-50%);
      max-width: 96%;
      padding: 3px 6px;
      border-radius: 8px;
      background: rgba(12, 14, 22, 0.86);
      border: 1px solid rgba(139, 124, 255, 0.6);
      color: #e8eaf5;
      font: 9px/1.3 "Microsoft YaHei UI", system-ui, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 4;
    }
    body.adjust #wrap { outline: 1px dashed rgba(139, 124, 255, 0.85); outline-offset: -1px; cursor: grab; }
    body.adjust #wrap:active { cursor: grabbing; }
  </style>
</head>
<body class="no-image">
  <div id="wrap">
    <img id="img" alt="" />
    <canvas id="cv"></canvas>
    <div id="empty">这一套还没导入图片<br />去主界面「准星」页选一张</div>
  </div>
  <script src="crosshair.js"></script>
</body>
</html>
