<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>测试地图 · 云小抄自测用</title>
  <link rel="stylesheet" href="testmap.css" />
</head>
<body>
  <header class="hud">
    <div class="brand">
      <span class="dot"></span>
      <b>模拟游戏地图</b>
      <span class="tag">测试用 · 不是真的游戏</span>
    </div>
    <div class="stats">
      <div class="stat"><i>缩放</i><b id="zoomVal">100%</b></div>
      <div class="stat click"><i>点击计数</i><b id="clickVal">0</b></div>
      <button class="btn" id="btnReset">复位</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="world" id="world">
      <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#1b293d" stroke-width="1"/>
          </pattern>
          <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22334d"/><stop offset="1" stop-color="#182539"/>
          </linearGradient>
        </defs>

        <rect width="1000" height="700" fill="#0a1019"/>
        <rect width="1000" height="700" fill="url(#grid)"/>

        <!-- 街区 -->
        <g fill="#16233a" stroke="#22344f" stroke-width="1.5">
          <rect x="60" y="60" width="240" height="170" rx="8"/>
          <rect x="360" y="40" width="210" height="140" rx="8"/>
          <rect x="650" y="70" width="280" height="180" rx="8"/>
          <rect x="70" y="300" width="190" height="200" rx="8"/>
          <rect x="330" y="250" width="250" height="190" rx="8"/>
          <rect x="660" y="310" width="270" height="160" rx="8"/>
          <rect x="80" y="560" width="250" height="110" rx="8"/>
          <rect x="400" y="500" width="200" height="150" rx="8"/>
          <rect x="680" y="530" width="240" height="130" rx="8"/>
        </g>

        <!-- 道路 -->
        <g stroke="url(#road)" stroke-width="26" fill="none" stroke-linecap="round">
          <path d="M0 270 H1000"/><path d="M0 480 H1000"/>
          <path d="M310 0 V700"/><path d="M620 0 V700"/>
        </g>

        <!-- 地标 -->
        <g class="poi">
          <g transform="translate(470,300)">
            <circle r="20" fill="none" stroke="#f2b035" stroke-width="3"/>
            <circle r="6" fill="#f2b035"/>
            <text y="44" text-anchor="middle" fill="#f2b035">钥匙房</text>
          </g>
          <g transform="translate(800,180)">
            <circle r="20" fill="none" stroke="#ef5f6b" stroke-width="3"/>
            <circle r="6" fill="#ef5f6b"/>
            <text y="44" text-anchor="middle" fill="#ef5f6b">高危刷怪点</text>
          </g>
          <g transform="translate(160,600)">
            <circle r="20" fill="none" stroke="#43d17c" stroke-width="3"/>
            <circle r="6" fill="#43d17c"/>
            <text y="44" text-anchor="middle" fill="#43d17c">撤离点</text>
          </g>
          <g transform="translate(760,560)">
            <circle r="20" fill="none" stroke="#9d7bff" stroke-width="3"/>
            <circle r="6" fill="#9d7bff"/>
            <text y="44" text-anchor="middle" fill="#9d7bff">隐藏物资</text>
          </g>
        </g>

        <!-- 玩家 -->
        <g transform="translate(560,420)">
          <circle r="34" fill="rgba(77,216,230,.10)"/>
          <path d="M0 -20 L15 15 L0 8 L-15 15 Z" fill="#4dd8e6"/>
        </g>
      </svg>
    </div>

    <div class="hint">
      <b>怎么用：</b>滚轮缩放地图 · 按住拖动平移 · 点击任意位置计数 +1
      <span>把小抄盖上来后：鼠标离开小抄约 2.6 秒再点，计数会 +1 就说明穿透成功</span>
    </div>

    <div class="flash" id="flash"></div>
  </main>

  <script src="testmap.js"></script>
</body>
</html>
